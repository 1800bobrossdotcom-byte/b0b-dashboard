<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:default}
/* Flex column instead of a computed top offset. The old rule positioned ENTER at
   50% + half the video height + 18px, which on a phone in landscape put the button
   below the fold - and with overflow:hidden there was no way to scroll to it, so the
   site could not be entered at all. Here the video is capped by BOTH width and
   available height, so the button is always on screen at any aspect ratio. */
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:18px;height:100vh;height:100dvh;padding:14px}
/* Two transmissions side by side. Each is capped by width AND by available
   height so the ENTER button below can never be pushed off screen - the same
   constraint that fixed the landscape bug, now sized for a pair. */
#vids{position:relative;z-index:1;flex:0 1 auto;display:flex;gap:14px;
justify-content:center;align-items:center;max-width:100%}
#vids .vid{aspect-ratio:16/9;flex:0 1 auto;
width:min(45vw, 520px, calc((100dvh - 116px) * 16 / 9))}
#vids iframe{width:100%;height:100%;border:none;display:block}
/* Under ~760px two 16:9 frames side by side are unusably small, so stack them -
   and halve the height budget, since there are now two of them plus a gap. */
@media (max-width:760px){
  #vids{flex-direction:column;gap:12px}
  #vids .vid{width:min(92vw, 620px, calc(((100dvh - 130px) / 2) * 16 / 9))}
}
#gate{position:relative;z-index:2;flex:0 0 auto;
display:flex;align-items:center;gap:10px}
#gate button{background:transparent;border:1px solid #333;border-radius:3px;
color:#666;font-family:monospace;font-size:11px;letter-spacing:2px;
padding:12px 26px;min-height:44px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
transition:border-color 0.3s,color 0.3s}
#gate button:hover,#gate button:focus{border-color:#777;color:#bbb}
#gate .err{color:#400;font-size:8px;font-family:monospace;opacity:0;transition:opacity 0.3s}
</style>
</head>
<body>
<canvas id="c" style="position:fixed;inset:0;z-index:0"></canvas>
<div id="vids">
  <div class="vid">
    <iframe src="https://www.youtube-nocookie.com/embed/AmTnNRJtrqE?autoplay=1&mute=1&loop=1&playlist=AmTnNRJtrqE&controls=1&rel=0&playsinline=1"
      title="TRANSMISSION - THE SQUID (ERC-1155)"
      allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <div class="vid">
    <iframe src="https://www.youtube-nocookie.com/embed/hnTSb2mZGKw?autoplay=1&mute=1&loop=1&playlist=hnTSb2mZGKw&controls=1&rel=0&playsinline=1"
      title="TRANSMISSION - DREAM COLONY (ERC-1155)"
      allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>
<div id="gate">
  <button type="button" id="enter">ENTER</button>
  <span class="err" id="err"></span>
</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');
var W,H,px,py,on=false,t=0;

function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

// Enter or Space from anywhere - the button is the only control on the page, so
// requiring a Tab to reach it first is a needless barrier on desktop. Skipped when
// the button already has focus, since the browser fires its own click there and we
// would otherwise POST twice.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return;
  var b=document.getElementById('enter');
  if(!b||b.disabled)return;
  // preventDefault cancels the browser's own activation of a focused button, so
  // this handler is the single path in every case - focused or not - and the
  // disabled flag set inside the click handler stops any second POST.
  e.preventDefault();
  b.click();
});

document.getElementById('enter').addEventListener('click',function(){
  var btn=this;
  btn.disabled=true;
  fetch('/api/gate',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'same-origin',
    body:JSON.stringify({})
  }).then(function(r){
    if(r.ok){
      window.location.href='/map';
      return;
    }
    btn.disabled=false;
    var err=document.getElementById('err');
    err.textContent='no';
    err.style.opacity='1';
    setTimeout(function(){err.style.opacity='0';},1500);
  }).catch(function(){
    btn.disabled=false;
    var err=document.getElementById('err');
    err.textContent='no';
    err.style.opacity='1';
    setTimeout(function(){err.style.opacity='0';},1500);
  });
});

function tick(){
  x.clearRect(0,0,W,H);
  t++;
  if(t>Math.random()*90+20){
    on=!on;
    if(on){px=Math.random()*W;py=Math.random()*H;}
    t=0;
  }
  if(on){
    x.fillStyle='#fff';
    x.fillRect(Math.floor(px),Math.floor(py),1,1);
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
