<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:default}
#vid-wrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;
width:min(90vw,800px);aspect-ratio:16/9}
#vid-wrap iframe{width:100%;height:100%;border:none}
#gate{position:fixed;left:50%;transform:translateX(-50%);
top:calc(50% + min(90vw,800px) * 9 / 32 + 18px);z-index:2;
display:flex;align-items:center;gap:10px}
#gate button{background:transparent;border:1px solid #333;border-radius:3px;
color:#666;font-family:monospace;font-size:11px;letter-spacing:2px;
padding:6px 18px;cursor:pointer;outline:none;
transition:border-color 0.3s,color 0.3s}
#gate button:hover,#gate button:focus{border-color:#777;color:#bbb}
#gate .err{color:#400;font-size:8px;font-family:monospace;opacity:0;transition:opacity 0.3s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vid-wrap">
  <iframe src="https://www.youtube-nocookie.com/embed/iqdIkDCMkzI?autoplay=1&loop=1&playlist=iqdIkDCMkzI&controls=1&rel=0"
    title="Background video"
    allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
<div id="gate">
  <button type="button" id="enter">ENTER</button>
  <span class="err" id="err"></span>
</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');
var W,H,px,py,on=false,t=0;

function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

document.getElementById('enter').addEventListener('click',function(){
  var btn=this;
  btn.disabled=true;
  fetch('/api/gate',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'same-origin',
    body:JSON.stringify({})
  }).then(function(r){
    if(r.ok){
      window.location.href='/map';
      return;
    }
    btn.disabled=false;
    var err=document.getElementById('err');
    err.textContent='no';
    err.style.opacity='1';
    setTimeout(function(){err.style.opacity='0';},1500);
  }).catch(function(){
    btn.disabled=false;
    var err=document.getElementById('err');
    err.textContent='no';
    err.style.opacity='1';
    setTimeout(function(){err.style.opacity='0';},1500);
  });
});

function tick(){
  x.clearRect(0,0,W,H);
  t++;
  if(t>Math.random()*90+20){
    on=!on;
    if(on){px=Math.random()*W;py=Math.random()*H;}
    t=0;
  }
  if(on){
    x.fillStyle='#fff';
    x.fillRect(Math.floor(px),Math.floor(py),1,1);
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
