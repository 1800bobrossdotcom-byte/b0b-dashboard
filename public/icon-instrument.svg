<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Grid of pads -->
  <g transform="translate(96,80)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#00ff41" opacity="0.8"/>
    <rect x="80" y="0" width="70" height="70" rx="8" fill="#00ff41" opacity="0.5"/>
    <rect x="160" y="0" width="70" height="70" rx="8" fill="#00ccff" opacity="0.7"/>
    <rect x="240" y="0" width="70" height="70" rx="8" fill="#00ff41" opacity="0.3"/>
    <!-- Row 2 -->
    <rect x="0" y="80" width="70" height="70" rx="8" fill="#00ccff" opacity="0.4"/>
    <rect x="80" y="80" width="70" height="70" rx="8" fill="#ffaa50" opacity="0.7"/>
    <rect x="160" y="80" width="70" height="70" rx="8" fill="#00ff41" opacity="0.6"/>
    <rect x="240" y="80" width="70" height="70" rx="8" fill="#cc88ff" opacity="0.6"/>
    <!-- Row 3 -->
    <rect x="0" y="160" width="70" height="70" rx="8" fill="#ffaa50" opacity="0.5"/>
    <rect x="80" y="160" width="70" height="70" rx="8" fill="#00ff41" opacity="0.7"/>
    <rect x="160" y="160" width="70" height="70" rx="8" fill="#00ccff" opacity="0.5"/>
    <rect x="240" y="160" width="70" height="70" rx="8" fill="#ffaa50" opacity="0.8"/>
    <!-- Row 4 -->
    <rect x="0" y="240" width="70" height="70" rx="8" fill="#cc88ff" opacity="0.4"/>
    <rect x="80" y="240" width="70" height="70" rx="8" fill="#00ccff" opacity="0.6"/>
    <rect x="160" y="240" width="70" height="70" rx="8" fill="#ffaa50" opacity="0.4"/>
    <rect x="240" y="240" width="70" height="70" rx="8" fill="#00ff41" opacity="0.5"/>
  </g>
  <!-- Wave lines overlay -->
  <path d="M80 430 Q160 410 256 430 Q352 450 432 430" stroke="#ff4444" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M80 445 Q160 425 256 445 Q352 465 432 445" stroke="#ff4444" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Text -->
  <text x="256" y="495" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="28" font-weight="bold" letter-spacing="4">TONE LAB</text>
