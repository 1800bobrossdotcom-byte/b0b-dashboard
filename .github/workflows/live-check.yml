name: Live Check

# Catches silent deploy failures: a push can land on main while the Vercel
# webhook never fires, leaving production serving stale content with no signal.
# Compares the live build's content-manifest timestamp against this repo.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'   # drift catcher between pushes
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify production matches this commit
        run: node scripts/check-live.js --wait
      # Once the deploy is confirmed live, tell IndexNow-capable engines
      # (Bing, Yandex) to re-crawl. No-ops until the secret is configured.
      - name: Live SEO surface
        run: node scripts/seo-check-live.js
      - name: IndexNow ping
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          B0B_INDEXNOW_KEY: ${{ secrets.B0B_INDEXNOW_KEY }}
        run: node scripts/indexnow-ping.js
